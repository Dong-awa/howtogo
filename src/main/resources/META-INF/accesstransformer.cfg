# Access transformer for the pre-1.21.6 HUD render type.
#
# HudDraw.QUADS is built from RenderStateShard's constants, and on 1.20.6 those five are
# protected in NeoForge's patched jar while they are public in vanilla's. The same five
# references compile on 1.20.6 Fabric and on 1.21.1 NeoForge, so the difference is the jar, not
# the code -- which is why this is an access transformer and not a condition.
#
# Limited to those five fields on purpose. On the 1.21.x nodes they are already public and this
# is a no-op; a broader file would start changing things on versions that do not need it.
public net.minecraft.client.renderer.RenderStateShard POSITION_COLOR_SHADER
public net.minecraft.client.renderer.RenderStateShard TRANSLUCENT_TRANSPARENCY
public net.minecraft.client.renderer.RenderStateShard NO_DEPTH_TEST
public net.minecraft.client.renderer.RenderStateShard NO_CULL
public net.minecraft.client.renderer.RenderStateShard COLOR_WRITE