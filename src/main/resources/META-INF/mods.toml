# Forge 1.20.1 mod metadata. The NeoForge original shipped META-INF/neoforge.mods.toml, which is the
# same TOML shape under a new name: the loader still identifies itself as "javafml" and dependency
# entries still use `type`/`ordering`/`side`. Two things do differ, and the second one is not optional:
#
#   1. the file name, and
#   2. **Forge 1.20.1 requires `mandatory` on every dependency entry.** Omitting it is not a warning --
#      the loader rejects the whole file with
#        InvalidModFileException: Missing required field mandatory in dependency (main)
#      and the mod never appears in the list. This was found by actually starting a dedicated server;
#      nothing in the compile, the build or a bytecode inspection would have surfaced it.
modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"

[[mods]]
modId = "howtogo"
version = "${mod_version}"
displayName = "HowToGo | 问道"
description = '''
我的世界道路标记与实时导航。
Road marking and real-time navigation for Minecraft
'''
authors = "DongSZ"

# The 47.x series only. The range used to be effectively open-ended, which claimed compatibility
# with every later Forge -- 48 and beyond -- none of which this has ever been run against.
# A wrong upper bound is worse than a missing feature: it lets a player load the mod on a version it
# was never tested on and then report the breakage as a bug.
[[dependencies.howtogo]]
modId = "forge"
type = "required"
mandatory = true
versionRange = "[47,48)"
ordering = "NONE"
side = "BOTH"

[[dependencies.howtogo]]
modId = "minecraft"
type = "required"
mandatory = true
versionRange = "[1.20.1,1.20.2)"
ordering = "NONE"
side = "BOTH"

# Xaero's World Map is where every road, route and marker is actually drawn, and it is client-side
# only -- so this dependency has to say CLIENT, or it becomes a demand no dedicated server can
# satisfy. It is declared optional rather than required on purpose: the NeoForge original declared
# XaeroLib `required`+`BOTH`, which made a dedicated server refuse to start with "Mod howtogo
# requires xaerolib 1.1.0 or above" even though nothing of this mod ever runs there. RoadLayer
# already guards its whole registration behind ModList.isLoaded("xaeroworldmap") and degrades to
# "no map layer" without it, so optional is the honest declaration.
[[dependencies.howtogo]]
modId = "xaeroworldmap"
type = "optional"
mandatory = false
versionRange = "[1.40.0,)"
ordering = "AFTER"
side = "CLIENT"
