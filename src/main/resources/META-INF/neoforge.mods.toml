modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "howtogo"
version = "${mod_version}"
displayName = "HowToGo | 问道"
description = '''
我的世界道路标记与实时导航。
Road marking and real-time navigation for Minecraft
'''
authors = "DongSZ"

# The 21.1.x series only. The range used to be open-ended ([21.1.0,)), which claimed compatibility
# with every later NeoForge -- 21.2 and beyond -- none of which this has ever been run against.
# A wrong upper bound is worse than a missing feature: it lets a player load the mod on a version it
# was never tested on and then report the breakage as a bug.
[[dependencies.howtogo]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,21.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.howtogo]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "BOTH"

# Both halves of Xaero are client-side, and so is this mod: every feature of it renders through the
# world map, and the entry point is annotated @Mod(dist = Dist.CLIENT). XaeroLib was declared BOTH,
# which made a dedicated server refuse to start -- "Mod howtogo requires xaerolib 1.1.0 or above.
# Currently, xaerolib is not installed" -- even though nothing of this mod would ever run there. A
# client-side dependency has to say CLIENT, or it is a demand that no server can satisfy.
[[dependencies.howtogo]]
modId = "xaeroworldmap"
type = "required"
versionRange = "[1.40.0,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.howtogo]]
modId = "xaerolib"
type = "required"
versionRange = "[1.1.0,)"
ordering = "NONE"
side = "CLIENT"
