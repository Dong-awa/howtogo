modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "howtogo"
version = "${mod_version}"
displayName = "HowToGo | 问道"
description = '''
我的世界道路标记与实时导航。
Road marking and real-time navigation for Minecraft
'''
authors = "DongSZ"

# One node's release only, and the bounds are computed per node by the build script rather than
# written here -- this file is shared by all eight, so a literal in it would be right on exactly one
# and would make the other seven refuse to load on the version they were built for. The upper bound
# is closed deliberately: an open-ended range claims compatibility with every later NeoForge, none of
# which this has been run against, and a wrong upper bound is worse than a missing feature -- it lets
# a player load the mod on a version it was never tested on and then report the breakage as a bug.
# The access transformer below widens five RenderStateShard constants that NeoForge's 1.20.6 jar
# keeps protected. Declared here rather than per node because it is a no-op where they are already
# public.
[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[dependencies.howtogo]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_range}"
ordering = "NONE"
side = "BOTH"

# The access transformer below widens five RenderStateShard constants that NeoForge's 1.20.6 jar
# keeps protected. Declared here rather than per node because it is a no-op where they are already
# public.

[[dependencies.howtogo]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "BOTH"

# Both halves of Xaero are client-side, and so is this mod: every feature of it renders through the
# world map, and the entry point is annotated @Mod(dist = Dist.CLIENT). XaeroLib was declared BOTH,
# which made a dedicated server refuse to start -- "Mod howtogo requires xaerolib 1.1.0 or above.
# Currently, xaerolib is not installed" -- even though nothing of this mod would ever run there. A
# client-side dependency has to say CLIENT, or it is a demand that no server can satisfy.
# The access transformer below widens five RenderStateShard constants that NeoForge's 1.20.6 jar
# keeps protected. Declared here rather than per node because it is a no-op where they are already
# public.

[[dependencies.howtogo]]
modId = "xaeroworldmap"
type = "required"
versionRange = "[1.40.0,)"
ordering = "AFTER"
side = "CLIENT"

# The access transformer below widens five RenderStateShard constants that NeoForge's 1.20.6 jar
# keeps protected. Declared here rather than per node because it is a no-op where they are already
# public.

[[dependencies.howtogo]]
modId = "xaerolib"
type = "required"
versionRange = "[1.1.0,)"
ordering = "NONE"
side = "CLIENT"
