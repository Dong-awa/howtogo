modLoader = "javafml"
# Expanded per node. javafml's major tracks FancyModLoader's, which moves at every NeoForge
# generation (20.4 -> 2, 20.6 -> 3, 21.1 -> 4, 21.4 -> 6, 21.6/21.8 -> 9, 26.x -> 11/12), so a
# literal is below the loader on the older nodes -- "Missing language javafml version [4,)" is
# what 1.20.6 answered to the old "[4,)" -- and above nothing on the newer ones. The range only
# has to admit the node's own loader; what actually pins compatibility is the NeoForge and
# Minecraft range below, which is computed from this node's versions.
loaderVersion = "${loader_range}"
license = "MIT"

[[mods]]
modId = "howtogo"
version = "${mod_version}"
displayName = "HowToGo | 问道"
description = '''
我的世界道路标记与实时导航。
Road marking and real-time navigation for Minecraft
'''
authors = "DongSZ, mc506lw, moshushi_mjs"

# One node's release only, and the bounds are computed per node by the build script rather than
# written here -- this file is shared by all twenty-one, so a literal in it would be right on exactly
# one and would make the other twenty refuse to load on the version they were built for. The upper
# bound is closed deliberately: an open-ended range claims compatibility with every later NeoForge,
# none of which this has been run against, and a wrong upper bound is worse than a missing feature --
# it lets a player load the mod on a version it was never tested on and then report the breakage as a
# bug.
#
# The two ranges below and the version above are expanded from the node's gradle.properties at build
# time (see the expand() call in build.neoforge.gradle.kts); bumping a version means editing that
# file, not this one. See docs/bumping-versions.md.
#
# The access transformer below widens five RenderStateShard constants that NeoForge's 1.20.6 jar
# keeps protected. Declared here rather than per node because it is a no-op where they are already
# public.
[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[dependencies.howtogo]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_range}"
ordering = "NONE"
side = "BOTH"

# The access transformer below widens five RenderStateShard constants that NeoForge's 1.20.6 jar
# keeps protected. Declared here rather than per node because it is a no-op where they are already
# public.

[[dependencies.howtogo]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "BOTH"

# Both halves of Xaero are client-side, and so is this mod: every feature of it renders through the
# world map, and the entry point is annotated @Mod(dist = Dist.CLIENT). XaeroLib was declared BOTH,
# which made a dedicated server refuse to start -- "Mod howtogo requires xaerolib 1.1.0 or above.
# Currently, xaerolib is not installed" -- even though nothing of this mod would ever run there. A
# client-side dependency has to say CLIENT, or it is a demand that no server can satisfy.
# The access transformer below widens five RenderStateShard constants that NeoForge's 1.20.6 jar
# keeps protected. Declared here rather than per node because it is a no-op where they are already
# public.

# The lower bound is expanded per node: Xaero's World Map split into World Map + XaeroLib at
# 1.40.0, and 1.20.6/1.21.6 only ever got the 1.39.x generation, so those two nodes declare
# [1.39.0,) in their own gradle.properties. Requiring 1.40.0 there is a demand no player can
# satisfy and FML refuses to start over it.
[[dependencies.howtogo]]
modId = "xaeroworldmap"
type = "required"
versionRange = "${xaero_range}"
ordering = "AFTER"
side = "CLIENT"

# The access transformer below widens five RenderStateShard constants that NeoForge's 1.20.6 jar
# keeps protected. Declared here rather than per node because it is a no-op where they are already
# public.

# Required where this node's world map actually ships XaeroLib (1.40.0 and later), optional where
# it does not. The 1.39.x generation -- all 1.20.6 and 1.21.6 ever got -- bundles no XaeroLib, and
# a required entry there is unsatisfiable: FML answers "Mod howtogo requires xaerolib 1.1.0 or
# above, currently xaerolib is not installed" and the game never starts. The type is expanded per
# node from whether that node compiles against a XaeroLib jar at all.
[[dependencies.howtogo]]
modId = "xaerolib"
type = "${xaerolib_type}"
versionRange = "[1.1.0,)"
ordering = "NONE"
side = "CLIENT"
