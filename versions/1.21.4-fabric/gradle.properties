# Per-node dependency wiring. Stonecutter gives every node its own gradle.properties next to
# the folder Gradle maps it to (versions/<name>/), and the shared build script reads these
# through property(). Anything identical across nodes belongs in the root gradle.properties.

# Fabric toolchain for this node. All three vary with the Minecraft version and are therefore
# per-node rather than constants in the build script: Loom 1.9 does not know about 1.21, and
# Loom 1.11 does not know about 1.20.
deps.loom=1.9.2
deps.fabric_loader=0.20.1
deps.fabric_api=0.119.4+1.21.4

# Xaero's World Map, the FABRIC build of it. A different artifact from the NeoForge jar the
# neoforge nodes use, and the two are not interchangeable -- the classes are remapped to
# different names. Loom remaps this one to the official names on the way in, so the file has to
# be the Fabric release; see libs/README.md.
deps.xaero=maven.modrinth:NcUtCpym:IoGJS3fE

# Versions neither the official repo (blocked here) nor bmclapi serves, expressed as
# group:artifact:version->group:artifact:version pairs the build resolves before anything else.
dependencySubstitutions=
