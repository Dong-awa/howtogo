# Per-node dependency wiring. Stonecutter gives every node its own gradle.properties next to
# the folder Gradle maps it to (versions/<name>/), and the shared build script reads these
# through property(). Anything identical across nodes belongs in the root gradle.properties.

# The NeoForge build this node compiles against.
deps.neo_loader=21.6.20-beta

# Xaero's World Map: the Modrinth coordinate for THIS Minecraft version, plus the jar that has
# to sit in libs/ (see libs/README.md). From 26.2 on Xaero ships in two parts and the second
# one -- XaeroLib, which owns the rendering API the mod compiles against -- is bundled inside
# the world map jar as a jar-in-jar and must be extracted next to it.
deps.xaero=maven.modrinth:NcUtCpym:qpxTn9xO
deps.xaerolib=

# 1.21.6 never got a 1.40.0 world map: 1.39.11 is the last release for this Minecraft version, and
# the 1.39.x generation predates the XaeroLib split (which is why deps.xaerolib is empty above and
# the metadata's xaerolib entry is optional). The runtime range this node declares therefore starts
# at 1.39.0 rather than the default 1.40.0 -- see the two blocks in build.neoforge.gradle.kts.
deps.xaero_range=[1.39.0,)

# Versions neither the official repo (blocked here) nor bmclapi serves, expressed as
# group:artifact:version->group:artifact:version pairs the build resolves before anything else.
#
# FML 9.0.2 publishes no POM for four of its parts on either host, and the NeoForm toolchain cannot
# build without them. 9.0.18 is the same line and is what this node's NeoForge build expects, and
# the workspace mirror carries it, so those four are pinned. Listed one artifact at a time rather
# than as a blanket rule, so that a part which does resolve at 9.0.2 is left alone.
dependencySubstitutions=net.neoforged.fancymodloader:loader:9.0.2->net.neoforged.fancymodloader:loader:9.0.18,net.neoforged.fancymodloader:earlydisplay:9.0.2->net.neoforged.fancymodloader:earlydisplay:9.0.18,net.neoforged.fancymodloader:securejarhandler:9.0.2->net.neoforged.fancymodloader:securejarhandler:9.0.18,net.neoforged.fancymodloader:bootstraplauncher:9.0.2->net.neoforged.fancymodloader:bootstraplauncher:9.0.18
