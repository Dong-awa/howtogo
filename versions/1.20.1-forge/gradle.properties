# Per-node dependency wiring. Stonecutter gives every node its own gradle.properties next to
# the folder Gradle maps it to (versions/<name>/).

# The Forge build this node compiles against. The version string carries the Minecraft version,
# which is how Forge names its artifacts.
deps.forge=1.20.1-47.4.28

# Xaero's World Map for this Minecraft version, as a Modrinth coordinate.
deps.xaero=maven.modrinth:NcUtCpym:PLACEHOLDER