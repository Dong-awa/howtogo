# Per-node dependency wiring. Stonecutter gives every node its own gradle.properties next to
# the folder Gradle maps it to (versions/<name>/), and the shared build script reads these
# through property(). Anything identical across nodes belongs in the root gradle.properties.

# The NeoForge build this node compiles against.
deps.neo_loader=26.2.0.90

# Xaero's World Map: the Modrinth coordinate for THIS Minecraft version, plus the jar that has
# to sit in libs/ (see libs/README.md). From 26.2 on Xaero ships in two parts and the second
# one -- XaeroLib, which owns the rendering API the mod compiles against -- is bundled inside
# the world map jar as a jar-in-jar and must be extracted next to it.
deps.xaero=maven.modrinth:NcUtCpym:dlK1uwnF
deps.xaerolib=xaerolib-neoforge-26.2-1.8.3.jar

# NeoFormRuntime version for THIS node only, for the same reason the 26.3 node pins it: the
# root 2.0.18 pins jst-cli-bundle 2.0.6, and 2.0.6 does not apply NeoForge's access transformer
# to ANONYMOUS inner classes. NeoForge 26.2's AT widens both HolderSet$Named.contents() and
# HolderSet$1.contents(); 2.0.6 widens only the former, so the NeoForm recompile dies with
#
#   ERROR Line: 44, <..HolderSet$1>..contents()....<..HolderSet$Named>..contents()
#   NodeExecutionException: Node action for recompile failed
#
# 2.0.31 is the lowest neoform-runtime that pins jst-cli-bundle 2.0.11. See the 26.3 node's
# gradle.properties for the full note; that node already carries this pin.
nfrt_version=2.0.31

# Versions neither the official repo (blocked here) nor bmclapi serves, expressed as
# group:artifact:version->group:artifact:version pairs the build resolves before anything else.
dependencySubstitutions=
