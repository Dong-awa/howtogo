# Project-wide settings. Anything that differs between Minecraft versions or loaders belongs in
# versions/<node>/gradle.properties instead -- see the files next to the folders Stonecutter
# creates under versions/. This file is read by every node and by the root project.

org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Mod
mod_version=0.2.1
maven_group=bili.dongsz.howtogo
archives_name=howtogo

# NeoFormRuntime, the tool that turns a Minecraft version into a compilable jar. Pinned because
# it otherwise downloads itself from maven.neoforged.net, which this network cannot reach.
nfrt_version=2.0.18

# Local JDKs (Zulu). Gradle's auto-detection does not look under D:\java, and the 26.x nodes
# compile with Java 25 while the 1.21.x nodes compile with 21 -- the toolchain block in
# build.neoforge.gradle.kts picks per node, these paths just make both JDKs visible.
org.gradle.java.installations.paths=D:\\java\\zulu21,D:\\java\\zulu25

# The Fabric toolchain version, declared here rather than per node because a Gradle plugins
# block is evaluated before a node's gradle.properties is in scope and cannot read one from it.
# It is global for now: every fabric node this tree has yet registered is 1.21.x, which Loom 1.9
# covers. The 1.20.x nodes need an older Loom and the 26.x nodes a newer one, so this has to
# become per-node -- most likely by giving each Loom generation its own build script, since the
# plugins block is the one place a node's properties cannot reach. Noted rather than solved.
fabric_loom_version=1.13.3

