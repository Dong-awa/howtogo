# Minecraft 1.20.1 is a Java 17 game. The build asks for a Java 17 toolchain and this branch sets no
# installation path, so Gradle uses a JDK 17 it can find on the machine (a JDK 21 running Gradle is
# fine -- only the toolchain has to be 17). Add
# org.gradle.java.installations.paths=... here if your JDK 17 lives somewhere Gradle does not look.

