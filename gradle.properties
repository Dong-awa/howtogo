# Project-wide settings. Anything that differs between Minecraft versions or loaders belongs in
# versions/<node>/gradle.properties instead -- see the files next to the folders Stonecutter
# creates under versions/. This file is read by every node and by the root project.

# 4G, not 2G: Fabric's remapJar runs TinyRemapper inside the daemon, and a whole-tree build
# remaps several nodes at once. At 2G that step dies with "java.lang.OutOfMemoryError: Java heap
# space" inside TinyRemapper.analyze, which Gradle only surfaces as "Failed to create service
# instance" from Loom's RemapJarTask -- the real cause is in the daemon log. This machine has
# 32G, so the extra headroom is cheap.
org.gradle.jvmargs=-Xmx4G -Dnet.minecraftforge.gradle.check.gradle=false

# ForgeGradle 6.0.54 refuses Gradle 9 outright, and the check has an off switch that its error
# message does not mention: net.minecraftforge.gradle.check.gradle, read froma
# EnvironmentChecks and enforcing 8.1 to 9.0. Turned off here because the whole tree is on
# Gradle 9.5.1 -- Loom needs Java 25 for the 26.x nodes, and Gradle 8 cannot run on Java 25.
# It applies only to ForgeGradle; nothing else reads it.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Mod
mod_version=0.2.3
maven_group=bili.dongsz.howtogo
archives_name=howtogo

# NeoFormRuntime, the tool that turns a Minecraft version into a compilable jar. Pinned because
# it otherwise downloads itself from maven.neoforged.net, which this network cannot reach.
nfrt_version=2.0.18

# Java toolchains. build.neoforge.gradle.kts selects Java 17/21/25 per node; the 26.x nodes
# require Java 25. Gradle discovers JDKs from JAVA_HOME and its standard installation paths.
# If the required JDKs live elsewhere, pass them explicitly:
#   -Porg.gradle.java.installations.paths=<jdk-17>,<jdk-21>,<jdk-25>

# The Fabric toolchain version, declared here rather than per node because a Gradle plugins
# block is evaluated before a node's gradle.properties is in scope and cannot read one from it.
# 1.17.20 is used for every registered Fabric node, including 26.x; those nodes also require
# the Gradle JVM itself to be Java 25.
fabric_loom_version=1.17.20

