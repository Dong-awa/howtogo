org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Mod
mod_version=0.2.1
maven_group=bili.dongsz.howtogo
archives_name=howtogo

# NeoForge / Minecraft
minecraft_version=1.21.6
neoforge_version=21.6.20-beta

# Xaero's World Map compile dependency: Modrinth maven coordinate for THIS MC version's build.
# The matching jar must also be copied into libs/ (see libs/README.md).
xaeroDependency=maven.modrinth:NcUtCpym:qpxTn9xO

# Local JDK (Zulu) - auto-detection misses D:\java. 1.21.x uses Java 21; 26.x uses Java 25.
javaToolchainVersion=21
org.gradle.java.installations.paths=D:\\java\\zulu21
nfrt_version=2.0.18

# Optional offline fallbacks for versions neither the official repo (blocked on this network)
# nor bmclapi serves. Format: group:artifact:version->group:artifact:version, comma-separated.
#
# 1.21.6-neoforge branch: neoforge 21.6.20-beta's pom requires FML 9.0.2. bmclapi serves the 9.0.2
# JARS but NOT their poms (404), so Gradle cannot resolve 9.0.2 directly; the mirror carries the
# near-identical sibling 9.0.18 (same FML 9.x line) and every compile-classpath artifact is
# substituted to it. This only covers the GRADLE side (the mod's own compileJava). The NFRT
# pipeline's recompile classpath still demands the exact 9.0.2 coordinates from neoforge's userdev
# config -- those are satisfied by seeding NFRT's own artifact cache
# (.gradle-home/caches/neoformruntime/artifacts/net/neoforged/fancymodloader/*/9.0.2/) with the
# jars bmclapi does serve, because NFRT checks its cache after the artifact manifest. junit-fml
# never resolves at all (not in the mirror at 9.0.18 either) and provably never needs to: it only
# lives in the modDevTestFixtures variant, which no configuration in this build consumes.
# NOTE: Gradle's module() notation accepts only group:artifact[:version] -- the group here is
# net.neoforged.fancymodloader, not net.neoforged, and a 4-segment coordinate fails to parse.
dependencySubstitutions=net.neoforged.fancymodloader:loader:9.0.2->net.neoforged.fancymodloader:loader:9.0.18,net.neoforged.fancymodloader:earlydisplay:9.0.2->net.neoforged.fancymodloader:earlydisplay:9.0.18,net.neoforged.fancymodloader:securejarhandler:9.0.2->net.neoforged.fancymodloader:securejarhandler:9.0.18,net.neoforged.fancymodloader:bootstraplauncher:9.0.2->net.neoforged.fancymodloader:bootstraplauncher:9.0.18
