org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft 1.20.1 is a Java 17 game and this build targets it, so the compile has to run on a JDK 17.
# Gradle normally finds an installed one by itself; if it cannot, point it at yours by uncommenting the
# next line. A launcher-provided runtime is fine for this -- the Minecraft launcher's
# `java-runtime-beta` is a full OpenJDK 17 *with javac*, which is what this port was built against.
#   org.gradle.java.installations.paths=/path/to/jdk-17

# Mod
mod_version=0.2.1+1.20.1
maven_group=bili.dongsz.howtogo
archives_name=howtogo

# Forge / Minecraft 1.20.1
minecraft_version=1.20.1
forge_version=47.4.10
