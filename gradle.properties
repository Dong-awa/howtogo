org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Mod
mod_version=0.2.1
maven_group=bili.dongsz.howtogo
archives_name=howtogo

# NeoForge / Minecraft
minecraft_version=26.2
neoforge_version=26.2.0.90

# Xaero's World Map compile dependency: Modrinth maven coordinate for THIS MC version's build.
# The matching jar must also be copied into libs/ (see libs/README.md).
xaeroDependency=maven.modrinth:NcUtCpym:dlK1uwnF

# Local JDK (Zulu) - auto-detection misses D:\java. 1.21.x uses Java 21; 26.x uses Java 25.
javaToolchainVersion=25
org.gradle.java.installations.paths=D:\\java\\zulu25
nfrt_version=2.0.18

# Optional offline fallbacks for versions neither the official repo (blocked on this network)
# nor bmclapi serves. Format: group:artifact:version->group:artifact:version, comma-separated.
#
# NOTE: substitutions are NOT used on this branch. neoforge 26.2.0.90's userdev config.json is what
# NFRT resolves artifacts by (it bypasses Gradle repos and would download from the blocked
# maven.neoforged.net), and a substitution re-keys the Gradle-resolved NFRT manifest to the sibling
# version, so NFRT misses the lookup anyway. Instead, the workspace mirror carries byte-identical
# stand-ins under the raw names neoforge 26.2.0.90 needs (same approach as the 26.3 branch):
#   net/neoforged/neoform/26.2-2/*                <- copies of 26.2-1 (pom/module edited, zip identical)
#   net/neoforged/fancymodloader/loader/11.0.16/* <- copies of 11.0.15
#   net/neoforged/fancymodloader/earlydisplay/11.0.16/* <- copies of 11.0.15
#dependencySubstitutions=
