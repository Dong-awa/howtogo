org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Mod
mod_version=0.2.2
maven_group=bili.dongsz.howtogo
archives_name=howtogo

# NeoForge / Minecraft
minecraft_version=1.21.1
neoforge_version=21.1.256

# The ranges META-INF/neoforge.mods.toml declares, kept here so that a version bump is one file.
# They are policy rather than arithmetic: "[21.1.0,21.2)" says this build is for the 21.1 series and
# deliberately refuses 21.2, which is why an upper bound exists at all. A wrong upper bound is worse
# than a missing feature -- it lets a player load the mod on a NeoForge it was never run against.
neoforge_range=[21.1.0,21.2)
minecraft_range=[1.21.1,1.21.2)
