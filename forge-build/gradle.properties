# The Forge build's own properties. Kept deliberately small: this build exists for one loader,
# and everything the main tree computes for Loom and ModDevGradle is irrelevant here.

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

# The Gradle that ForgeGradle 6 supports. Gradle 9 is refused by design and the check, while
# skippable, only hides that the plugin registers no tasks there.
forge_gradle_version=6.0.54

mod_version=0.2.1
maven_group=bili.dongsz
archives_base_name=howtogo