# Per-node dependency wiring for the Forge build.

# The Forge build this node compiles against. Forge puts the Minecraft version in its own
# version string, which is how it names its artifacts.
deps.forge=1.20.4-49.2.13

# Xaero's World Map for this Minecraft version, as a Modrinth coordinate.
deps.xaero=maven.modrinth:NcUtCpym:PLACEHOLDER