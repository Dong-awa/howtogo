plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
group = project.maven_group
base.archivesName = project.archives_name

java.toolchain.languageVersion = JavaLanguageVersion.of((project.findProperty('javaToolchainVersion') ?: '21') as Integer)

neoForge {
    version = project.neoforge_version

    // The NeoForm runtime tool downloads from maven.neoforged.net, which is unreachable on this
    // network. Pin it to the version cached in the local Gradle cache and served by the workspace
    // maven repo declared below, so builds work offline.
    neoFormRuntime {
        version = project.findProperty('nfrt_version') ?: '2.0.18'
    }

    runs {
        client {
            client()
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            // The in-game self-test, for tools/user-test/run-user-test.ps1: the rig runs the client with
            // -PhtgSelftest=<seconds> (and optionally -PhtgSelftestQuit=1) so the checks run themselves
            // once a world is loaded and the report lands in the log for the rig to grade. Empty -- the
            // default -- means the client behaves exactly as a player's does.
            systemProperty 'howtogo.selftest', project.findProperty('htgSelftest') ?: ''
            systemProperty 'howtogo.selftest.quit', project.findProperty('htgSelftestQuit') ?: ''
            // -PhtgQuickPlay=<world name> opens that world on start, which is what makes the rig a single
            // command: without it the client sits on the title screen and the checks, which are all about
            // a world, have nothing to read. Passing it through the run config because Gradle's own
            // --args replaces the launcher's arguments rather than adding to them.
            if (project.hasProperty('htgQuickPlay')) {
                programArgument '--quickPlaySingleplayer'
                programArgument project.property('htgQuickPlay')
            }
        }
    }

    mods {
        howtogo {
            sourceSet sourceSets.main
        }
    }
}

// The mod is split across two source roots so that the parts which are genuinely portable stay
// portable. Anything under src/common is pure Java -- the road network, the routing engine, the
// transit model, the reflective bridges to other mods -- and contains no Minecraft, loader or
// Xaero import at all, so the same files can be shared verbatim by every loader/version branch
// instead of being forked and left to drift. src/main holds everything that has to know which
// Minecraft and which loader it is running on.

sourceSets {
    main {
        java.srcDirs = ['src/main/java', 'src/common/java']
    }
}

// The mcphone compat package compiles against the (private, not on Modrinth) mcphone mod's API
// jar. When that jar is absent from libs/, exclude the compat sources and their ServiceLoader
// registration from the build instead of failing: the classes are only ever loaded when mcphone
// itself is installed, so an install without the jar loses nothing.
def mcphoneApiJar = fileTree(dir: 'libs', include: ['*.jar']).find { f ->
    try {
        new java.util.zip.ZipFile(f).getEntry('com/november/mcphone/api/client/app/IPhoneApp.class') != null
    } catch (Exception ignored) {
        false
    }
}
if (mcphoneApiJar == null) {
    sourceSets.main.java.exclude '**/compat/mcphone/**'
    sourceSets.main.resources.exclude 'META-INF/services/com.november.mcphone.api.client.app.IPhoneApp'
}

repositories {
    // The moddev plugin injects two maven.neoforged.net repositories (releases + mojang-meta) at
    // apply time and sorts them in front of everything else. That host is unreachable on this
    // network and stalls every resolution until timeout, so drop them here -- everything they
    // served is mirrored in the workspace-local repo below (seeded from the Gradle cache) or on
    // the bmclapi2 mirror.
    def deadRepos = repositories.findAll { r ->
        try { r.url != null && r.url.toString().contains('maven.neoforged.net') } catch (Exception ignored) { false }
    }
    deadRepos.each { repositories.remove(it) }

    // Workspace-local mirror carrying the NeoForm toolchain (neoform-runtime, neoform, mergetool,
    // AutoRenamingTool, ...) and the minecraft-dependencies module metadata, which ship no POM-only
    // fallback here -- Gradle module metadata is the only thing it stores for some of them.
    // Git worktrees pass -PhtgLocalMaven=<absolute path> to share the main checkout's mirror.
    maven {
        name = 'workspace-local-mirror'
        url = uri(project.findProperty('htgLocalMaven') ?: "${rootDir}/.recon/maven-local")
        metadataSources { it.gradleMetadata() }
    }
    // bmclapi2 proxies Maven Central (plus parts of the neoforged repo), so it sits right after the
    // local mirror to satisfy the parent POMs (commons-parent etc.) that the Mojang library POMs
    // reference -- the Mojang host serves only the leaf artifacts.
    maven { name = 'bmclapi-mirror'; url = 'https://bmclapi2.bangbang93.com/maven' }
    // Mojang's own library host is reachable and serves the com.mojang / bundled Minecraft
    // dependencies that minecraft-dependencies references with strict versions.
    maven {
        name = 'mojang-libraries'
        url = 'https://libraries.minecraft.net/'
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    flatDir { dirs 'libs' }
}

dependencies {
    // Xaero's World Map is closed-source and not published to any Maven repo.
    // We compile against the actual shipped jar (official Mojang mappings, no reobf needed).
    // The coordinate is version-specific -- see xaeroDependency in gradle.properties; the matching
    // jar must also sit in libs/ for the flatDir fileTree below.
    compileOnly project.property('xaeroDependency')

    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: project.minecraft_version,
            neoforge_version : project.neoforge_version,
            mod_version      : project.mod_version,
    ]
    inputs.properties replaceProperties
    // The licence goes into the jar as well as the repository. MIT requires the notice to travel
    // with every copy, and the copy people actually receive is the jar, not the checkout.
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
    }
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Offline-mirror escape hatch: gradle.properties may declare dependencySubstitutions as a
// comma-separated list of "group:artifact:version->group:artifact:version" pairs. Used when the
// blocked official repo and bmclapi both lack an exact version but the workspace mirror holds a
// compatible sibling (e.g. FML 11.0.16 -> 11.0.15, neoform 26.2-2 -> 26.2-1).
//
// Implemented as an eachDependency callback rather than resolutionStrategy.dependencySubstitution:
// the plugin's eagerly-resolved neoFormRuntimeDependencies* configurations do not honour static
// substitution rules (observed on Gradle 9.7.1 + moddev 2.0.148 -- the rule compiled fine but
// dependencyInsight still resolved neoform 26.2-2), while eachDependency fires for every
// configuration including those.
def subProps = (project.findProperty('dependencySubstitutions') ?: '').toString().split(',').findAll { it.contains('->') }
if (!subProps.isEmpty()) {
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            subProps.each { String raw ->
                def pair = raw.trim().split(/->/)*.trim()
                def fromParts = pair[0].split(':')
                def toParts = pair[1].split(':')
                def fromVersion = fromParts.length > 2 ? fromParts[2] : null
                if (details.requested.group == fromParts[0] && details.requested.name == fromParts[1]
                        && (fromVersion == null || details.requested.version == fromVersion)) {
                    def target = toParts.length > 2 ? pair[1] : "${toParts[0]}:${toParts[1]}:${details.requested.version}"
                    details.useTarget(target)
                }
            }
        }
    }
}
