plugins {
    id 'fabric-loom' version '1.9.2'
    id 'java'
}

version = project.mod_version
group = project.maven_group
base.archivesName = project.archives_name

// Minecraft 1.20.1 is a Java 17 game. (The NeoForge original targeted Java 21.)
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    // Xaero publishes an official developer Maven; the shipped jar is also usable directly.
    maven { url = 'https://chocolateminecraft.com/maven' }
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Official Mojang mappings, not Yarn: the whole codebase (33k lines) is written against
    // net.minecraft.* official names, and re-writing it to Yarn would be a rename pass with no
    // functional gain. Loom remaps Fabric API and mod jars to these names for us.
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // ONLY Xaero's World Map is a compile-time dependency: six files import its element-render
    // API directly. MTR (org.mtr.*), Create (com.simibubi.*) and Xaero's Minimap (xaero.common.*)
    // are reached purely by reflection -- Class.forName + getMethod -- so those jars are runtime
    // mods, not compile inputs, and are deliberately absent here.
    modCompileOnly files('libs/xaeroworldmap-fabric-1.20.1-1.47.0.jar')
}

// Minecraft 1.20.1 declares RenderType.CompositeState protected, which 1.21.1 widened to public; the
// HUD's render type needs it. Fabric's access widener is the equivalent of an access transformer.
loom {
    accessWidenerPath = file('src/main/resources/howtogo.accesswidener')
}

// Mirrors the original's split: src/common is loader-free, portable Java; src/main knows which
// Minecraft and which loader it runs on. -PonlyCommon compiles just the portable half, which is
// how the portability claim gets tested rather than asserted.
def onlyCommon = project.hasProperty('onlyCommon')
sourceSets {
    main {
        java.srcDirs = onlyCommon ? ['src/common/java'] : ['src/main/java', 'src/common/java']
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // javac stops at 100 errors by default, which hides the shape of a port. Raise it so the
    // inventory is complete.
    options.compilerArgs += ['-Xmaxerrs', '100000']
}

// Diagnostic helper: prints the compile classpath and the resolved Minecraft jar so the real
// 1.20.1 API can be inspected with javap instead of guessed at.
tasks.register('dumpCompileClasspath') {
    doLast {
        new File(projectDir, 'compile-classpath.txt').text = sourceSets.main.compileClasspath.asPath
        println "compile classpath written to compile-classpath.txt"
    }
}

// fabric.mod.json carries ${version}, which has to be expanded as it is written into the jar --
// the NeoForge original did the same for neoforge.mods.toml. The licence travels with the jar for
// the same reason it did there: MIT requires the notice to accompany every copy, and the copy
// people receive is the jar.
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
    }
}
