plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

// Version numbers are read from this project's own gradle.properties, by file.
//
// Two separate problems are solved by reading the file rather than a project property:
//
//  * `project.mod_version` is a dot-access on Gradle's dynamic property bag, so an IDE reading this
//    script as text has no symbol to resolve it against and flags all three as unresolved. A key in
//    gradle.properties is not a field of the project.
//  * A property of that name can also arrive from somewhere that is not this file -- the
//    gradle.properties of a directory the IDE happened to open above this one, or a -P on a command
//    line -- and then the build succeeds with somebody else's number on it. That is not hypothetical:
//    a jar named howtogo-1.0.0.jar came out of a build of this project, and 1.0.0 is the mod_version of
//    a different project sitting next door. Reading the file this repository ships makes the answer
//    local, explicit and the same no matter who starts the build.
//
// A missing key is a failure that names it, rather than a null that surfaces later as the literal
// string "null" in the jar's name and in its mods.toml.
def localProperties = new Properties()
file('gradle.properties').withInputStream { localProperties.load(it) }
def property = { String name ->
    def value = localProperties.getProperty(name)
    if (value == null || value.isBlank()) {
        throw new GradleException("gradle.properties is missing '" + name + "'")
    }
    value
}

version = property('mod_version')
group = property('maven_group')
base.archivesName = property('archives_name')

// Said out loud on every invocation, so a build whose output does not match this line is visibly
// wrong in the IDE's own build output rather than only in the jar's name.
logger.lifecycle("HowToGo {} | group {} | NeoForge {} | Minecraft {}",
        version, group, property('neoforge_version'), property('minecraft_version'))

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = property('neoforge_version')

    runs {
        client {
            client()
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            // The in-game self-test, for tools/user-test/run-user-test.ps1: the rig runs the client with
            // -PhtgSelftest=<seconds> (and optionally -PhtgSelftestQuit=1) so the checks run themselves
            // once a world is loaded and the report lands in the log for the rig to grade. Empty -- the
            // default -- means the client behaves exactly as a player's does.
            systemProperty 'howtogo.selftest', project.findProperty('htgSelftest') ?: ''
            systemProperty 'howtogo.selftest.quit', project.findProperty('htgSelftestQuit') ?: ''
            // -PhtgQuickPlay=<world name> opens that world on start, which is what makes the rig a single
            // command: without it the client sits on the title screen and the checks, which are all about
            // a world, have nothing to read. Passing it through the run config because Gradle's own
            // --args replaces the launcher's arguments rather than adding to them.
            if (project.hasProperty('htgQuickPlay')) {
                programArgument '--quickPlaySingleplayer'
                programArgument project.property('htgQuickPlay')
            }
        }
    }

    mods {
        howtogo {
            sourceSet sourceSets.main
        }
    }
}

// The mod is split across two source roots so that the parts which are genuinely portable stay
// portable. Anything under src/common is pure Java -- the road network, the routing engine, the
// transit model, the reflective bridges to other mods -- and contains no Minecraft, loader or
// Xaero import at all, so the same files can be shared verbatim by every loader/version branch
// instead of being forked and left to drift. src/main holds everything that has to know which
// Minecraft and which loader it is running on.

sourceSets {
    main {
        java.srcDirs = ['src/main/java', 'src/common/java']
    }
}

//repositories.clear()

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    flatDir { dirs 'libs' }
}

dependencies {
    // Xaero's World Map is closed-source and not published to any Maven repo.
    // We compile against the actual shipped jar (official Mojang mappings, no reobf needed).
    compileOnly "maven.modrinth:NcUtCpym:SnQ4SoDe"

    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}

tasks.named('processResources', ProcessResources).configure {
    // expand() reads the template and writes the result in the platform default charset. On a JDK
    // older than 18 that is the system code page rather than UTF-8, so a build started by a tool that
    // pins its own JVM turned the mod's Chinese display name into mojibake inside the jar -- the file
    // was right and the build was the thing that misread it. Stated here so the copy in the jar is
    // byte-identical to the one in the repository whoever runs the build.
    filteringCharset = 'UTF-8'

    var replaceProperties = [
            minecraft_version: property('minecraft_version'),
            neoforge_version : property('neoforge_version'),
            mod_version      : property('mod_version'),
            // The dependency ranges as well, so that a version bump is gradle.properties and nothing
            // else. See docs/bumping-versions.md.
            neoforge_range   : property('neoforge_range'),
            minecraft_range  : property('minecraft_range'),
    ]
    inputs.properties replaceProperties
    // The licence goes into the jar as well as the repository. MIT requires the notice to travel
    // with every copy, and the copy people actually receive is the jar, not the checkout.
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
    }
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
